# Test every push and pull request; deploy main to the host named in the repository's settings.
#
# Deploying needs, under the repository's Actions settings:
#   variables DEPLOY_HOST, DEPLOY_USER, DEPLOY_HOST_KEY (the host's ed25519 key fingerprint, SHA256:…)
#   secret    DEPLOY_SSH_KEY, a key the host only accepts for "deploy <commit SHA>"
# Without DEPLOY_HOST (a fork, say) the deploy job is skipped.
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stribog-deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: docker
    container: node:26-bookworm
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install
        run: |
          npm install --global --no-fund --no-audit pnpm@9.15.4
          pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Typecheck and build
        run: pnpm build

  deploy:
    needs: test
    if: ${{ forgejo.event_name != 'pull_request' && forgejo.ref == 'refs/heads/main' && vars.DEPLOY_HOST != '' }}
    runs-on: docker
    container: alpine:3.22
    timeout-minutes: 30
    steps:
      - name: Deploy the tested commit
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          DEPLOY_SHA: ${{ forgejo.sha }}
        run: |
          set -eu
          apk add --no-cache openssh-client
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test "$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')" = "$DEPLOY_HOST_KEY"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_SHA"
